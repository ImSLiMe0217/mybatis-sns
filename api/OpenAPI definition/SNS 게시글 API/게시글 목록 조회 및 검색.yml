info:
  name: 게시글 목록 조회 및 검색
  type: http
  seq: 4
  tags:
    - SNS 게시글 API

http:
  method: GET
  url: "{{baseUrl}}/posts"
  params:
    - name: keyword
      value: ""
      type: query
      disabled: true
    - name: memberId
      value: ""
      type: query
      disabled: true
    - name: targetMemberIds
      value: "[]"
      type: query
      disabled: true
    - name: sortOrder
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: 목록 조회 성공
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: GET
      params:
        - name: keyword
          value: ""
          type: query
          disabled: true
        - name: memberId
          value: ""
          type: query
          disabled: true
        - name: targetMemberIds
          value: "[]"
          type: query
          disabled: true
        - name: sortOrder
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "memberId": 1,
              "content": "스프링 부트 학습중",
              "imageUrl": "https://sample.com/image/hello.png",
              "likeCount": 201,
              "createdAt": "2026-09-08 13:23:00",
              "updateAt": "2026-09-08 14:23:00"
            }
          ]

docs: 검색 키워드 및 정렬 조건에 부합하는 게시글 목록을 반환합니다.
